<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ひらがな かるた</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Yu Gothic Medium","游ゴシック Medium",YuGothic,Meiryo,sans-serif;
    background:linear-gradient(180deg,#d4f5ff 0%,#c8f0d8 40%,#b0e8b8 100%);
    color:#4a3b2a;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }

  .screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;}
  .hidden{display:none!important;}

  /* HUD */
  .hud{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:5px;flex:0 0 auto;}
  .icon-btn{
    width:46px;height:46px;border-radius:50%;border:none;
    background:#fff;font-size:22px;line-height:1;
    box-shadow:0 4px 0 rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.1);
    cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    position:relative;flex:0 0 auto;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14);}
  .badge{
    position:absolute;top:-3px;right:-3px;
    min-width:22px;height:22px;border-radius:11px;
    background:#ff6b9d;color:#fff;
    font-size:12px;font-weight:900;
    display:none;align-items:center;justify-content:center;
    padding:0 5px;border:2px solid #fff;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .badge.show{display:flex;}
  .hud-center{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;}
  .stars{
    display:flex;align-items:center;gap:6px;
    background:#fff;border-radius:999px;padding:5px 16px 5px 14px;
    box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.1);
    font-size:clamp(18px,5vw,22px);font-weight:900;color:#f5a623;
  }
  .star-icon{font-size:clamp(18px,5vw,22px);}
  .stars.bump{animation:bump .45s;}
  @keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.28);}100%{transform:scale(1);}}
  .sticker-progress{display:flex;gap:4px;margin-left:4px;}
  .dot{
    width:10px;height:10px;border-radius:50%;
    background:#e8e0d5;
    transition:background .3s, box-shadow .3s;
  }
  .dot.filled{background:#ffb74d;box-shadow:0 0 7px #ffb74d;}

  /* 音声読み上げパネル */
  .kana-question{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:12px;
    padding:6px 14px 4px;
    cursor:pointer;
    position:relative;
  }
  .kana-question:active{transform:scale(.99);}
  .kana-display{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:#fff;
    border-radius:22px;
    padding:6px 22px 4px;
    box-shadow:0 6px 0 rgba(0,0,0,.08), 0 10px 22px rgba(0,0,0,.1);
    border:4px solid #fff;
    min-width:130px;
  }
  .kana-char{
    font-size:clamp(44px,13vw,66px);
    font-weight:900;
    color:#ff6b9d;
    line-height:1;
    text-shadow:2px 2px 0 #ffe0ec;
    font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;
  }
  .kana-hint{
    font-size:clamp(11px,3.3vw,14px);
    font-weight:900;
    color:#8a7a68;
    letter-spacing:1px;
    white-space:nowrap;
  }
  .replay-icon{
    font-size:clamp(24px,6.5vw,32px);
    line-height:1;
    animation:replayBob 1.4s ease-in-out infinite;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));
  }
  @keyframes replayBob{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-4px) scale(1.1);}
  }
  .kana-question.playing .replay-icon{
    animation:replayActive .6s ease-in-out infinite;
  }
  @keyframes replayActive{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
  }

  /* プレイフィールド */
  .playfield{
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    min-height:0;
    margin:0 10px 10px;
    border-radius:26px;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.45) 0 6px, transparent 7px),
      radial-gradient(circle at 78% 30%, rgba(255,255,255,.4) 0 8px, transparent 9px),
      radial-gradient(circle at 40% 78%, rgba(255,255,255,.4) 0 7px, transparent 8px),
      radial-gradient(circle at 88% 82%, rgba(255,255,255,.45) 0 6px, transparent 7px),
      linear-gradient(180deg, #e8f8d8 0%, #c4ecb0 100%);
    box-shadow:inset 0 4px 18px rgba(80,140,80,.18), inset 0 -6px 18px rgba(255,255,255,.6);
  }

  /* カゴ */
  .basket{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    width:clamp(96px,28vw,140px);
    height:clamp(84px,24vw,120px);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(64px,20vw,96px);
    line-height:1;
    z-index:2;
    pointer-events:none;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));
    transition:transform .18s, filter .18s;
  }
  .basket.hover{
    transform:translateX(-50%) scale(1.14);
    filter:
      drop-shadow(0 8px 12px rgba(0,0,0,.25))
      drop-shadow(0 0 26px rgba(255,209,102,.95))
      brightness(1.1);
  }
  .basket.happy{
    animation:basketHappy .6s ease-out;
  }
  @keyframes basketHappy{
    0%{transform:translateX(-50%) scale(1.14);}
    40%{transform:translateX(-50%) scale(1.3) rotate(-6deg);}
    70%{transform:translateX(-50%) scale(1.15) rotate(4deg);}
    100%{transform:translateX(-50%) scale(1.14);}
  }

  /* カード */
  .kana-card{
    position:absolute;
    top:0;left:0;
    width:clamp(78px,22vw,108px);
    height:clamp(78px,22vw,108px);
    border-radius:24px;
    background:linear-gradient(180deg,#fff7e0,#ffdfa0);
    border:4px solid #fff;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    will-change:transform;
    z-index:1;
    transition:box-shadow .15s, filter .15s;
  }
  .kana-card-inner{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(48px,15vw,74px);
    line-height:1;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.15));
    pointer-events:none;
  }
  .kana-card-inner svg{width:1em;height:1em;display:block;}
  .kana-card.grabbed{
    cursor:grabbing;
    z-index:100;
    box-shadow:
      0 0 0 6px rgba(255, 209, 102, .85),
      0 22px 36px rgba(0,0,0,.32);
    filter:brightness(1.06);
  }
  .kana-card.wrong{
    box-shadow:0 0 0 5px rgba(255,120,120,.9), 0 8px 18px rgba(0,0,0,.18);
  }
  .kana-card.wrong .kana-card-inner{
    animation:kanaShake .5s;
  }
  @keyframes kanaShake{
    0%,100%{transform:translateX(0) rotate(0);}
    20%{transform:translateX(-10px) rotate(-8deg);}
    40%{transform:translateX(10px) rotate(8deg);}
    60%{transform:translateX(-6px) rotate(-4deg);}
    80%{transform:translateX(6px) rotate(4deg);}
  }
  .kana-card.hint{
    animation:hintGlow 1s ease-in-out 2;
  }
  @keyframes hintGlow{
    0%,100%{box-shadow:0 8px 18px rgba(0,0,0,.18);}
    50%{box-shadow:0 0 0 8px rgba(255,209,102,.85), 0 8px 18px rgba(0,0,0,.18);}
  }

  /* 吹き出し・紙吹雪 */
  .bubble{
    position:fixed;left:50%;top:38%;
    transform:translate(-50%,-50%) scale(.4);
    background:#fff;color:#ff6b9d;font-weight:900;
    font-size:clamp(24px,7.5vw,42px);
    letter-spacing:2px;
    padding:16px 36px;border-radius:999px;
    border:5px solid #ffd9e6;
    box-shadow:0 8px 0 rgba(255,107,157,.35),0 14px 34px rgba(0,0,0,.2);
    pointer-events:none;z-index:190;opacity:0;white-space:nowrap;
  }
  .bubble.show{animation:bubblePop 1.3s ease-out forwards;}
  @keyframes bubblePop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.14);}
    34%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-72%) scale(1);}
  }
  .confetti{
    position:fixed;top:-50px;z-index:170;pointer-events:none;
    animation:fall linear forwards;
    will-change:transform;
  }
  @keyframes fall{
    to{transform:translateY(115vh) rotate(600deg);opacity:.85;}
  }

  /* シール選択画面 */
  #stickerSelectScreen{
    background:linear-gradient(180deg,#ffd6f0 0%,#ffe9b8 45%,#d4f0ff 100%);
    align-items:center;justify-content:center;
    padding:24px;gap:18px;text-align:center;
    overflow:hidden;z-index:50;
  }
  #stickerSelectScreen::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 12% 18%,rgba(255,255,255,.6) 0 8px,transparent 9px),
      radial-gradient(circle at 88% 24%,rgba(255,255,255,.6) 0 10px,transparent 11px),
      radial-gradient(circle at 22% 82%,rgba(255,255,255,.6) 0 9px,transparent 10px),
      radial-gradient(circle at 78% 76%,rgba(255,255,255,.6) 0 7px,transparent 8px);
    pointer-events:none;
  }
  .select-header{
    font-size:clamp(20px,5.8vw,30px);font-weight:900;
    color:#ff6b9d;letter-spacing:2px;
    text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(255,150,190,.3);
    animation:floaty 2.2s ease-in-out infinite;
    position:relative;z-index:2;
  }
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .select-sub{
    font-size:clamp(13px,3.8vw,17px);
    color:#7a6a58;font-weight:700;
    margin-top:-8px;position:relative;z-index:2;
  }
  .sticker-options{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;
    position:relative;z-index:2;margin-top:6px;
  }
  .sticker-option{
    font-family:inherit;
    width:clamp(84px,26vw,140px);
    height:clamp(84px,26vw,140px);
    border-radius:50%;border:6px solid #fff;
    background:radial-gradient(circle at 35% 30%,#fff,#ffe8f0);
    box-shadow:0 8px 0 rgba(255,107,157,.3),0 12px 24px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(46px,14vw,76px);
    cursor:pointer;padding:0;
    transition:transform .15s,box-shadow .15s;
    animation:stickerEnter .5s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .sticker-option:active{transform:translateY(6px) scale(.95);box-shadow:0 2px 0 rgba(255,107,157,.3);}
  @keyframes stickerEnter{
    from{transform:scale(0) rotate(-180deg);opacity:0;}
    to{transform:scale(1) rotate(0);opacity:1;}
  }
  .sticker-option.chosen{
    animation:chosenPop .7s cubic-bezier(.34,1.56,.64,1);
    border-color:#ffd166;
    box-shadow:0 0 0 12px rgba(255,209,102,.5),0 14px 28px rgba(0,0,0,.22);
    z-index:3;
  }
  @keyframes chosenPop{
    0%{transform:scale(1) rotate(0);}
    40%{transform:scale(1.3) rotate(10deg);}
    70%{transform:scale(.95) rotate(-6deg);}
    100%{transform:scale(1.08) rotate(0);}
  }
  .sticker-option.fade-out{animation:fadeOutShrink .6s forwards;}
  @keyframes fadeOutShrink{to{opacity:.15;transform:scale(.7);}}

  /* ひらがな帳 */
  #kanaChartScreen{
    z-index:60;
    background:linear-gradient(180deg,#fff8e8 0%,#fff0f8 100%);
    padding:10px 12px 16px;
  }
  .chart-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 0 10px;gap:10px;flex:0 0 auto;
  }
  .chart-title{
    font-size:clamp(17px,5vw,22px);
    font-weight:900;color:#ff6b9d;
    letter-spacing:2px;
    text-shadow:2px 2px 0 #fff;
    display:flex;align-items:center;gap:6px;
  }
  .chart-main{
    flex:1;min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:4px 0 8px;
  }
  .kana-chart-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:6px;
    max-width:480px;
    margin:0 auto;
  }
  .kana-cell{
    aspect-ratio:1;
    border-radius:14px;
    border:2.5px solid #fff;
    background:#f5f0ea;
    color:#d0c0b8;
    font-size:clamp(22px,6.5vw,34px);
    font-weight:900;
    font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    transition:transform .1s, box-shadow .1s;
    box-shadow:0 2px 4px rgba(0,0,0,.06);
    line-height:1;
  }
  .kana-cell:active:not(.empty){
    transform:translateY(2px);
    box-shadow:0 0 0 rgba(0,0,0,.06);
  }
  .kana-cell.empty{
    visibility:hidden;
    pointer-events:none;
  }
  .kana-cell.count-1-2{
    background:linear-gradient(180deg,#fffdf5,#ffe8c8);
    color:#8a5a10;
    box-shadow:0 2px 4px rgba(200,150,100,.22);
  }
  .kana-cell.count-3-4{
    background:linear-gradient(180deg,#ffe8f4,#ffc0d8);
    color:#a04a70;
    box-shadow:0 2px 4px rgba(255,150,190,.3);
  }
  .kana-cell.count-5plus{
    background:linear-gradient(180deg,#fff5c8,#ffd93d);
    color:#8a5a10;
    box-shadow:0 2px 4px rgba(255,200,60,.4), 0 0 14px rgba(255,217,61,.55);
    animation:goldGlow 2.4s ease-in-out infinite;
  }
  @keyframes goldGlow{
    0%,100%{box-shadow:0 2px 4px rgba(255,200,60,.4), 0 0 14px rgba(255,217,61,.55);}
    50%{box-shadow:0 2px 4px rgba(255,200,60,.4), 0 0 20px rgba(255,217,61,.9);}
  }
  .chart-summary{
    flex:0 0 auto;
    text-align:center;
    font-size:clamp(13px,3.7vw,15px);
    font-weight:900;
    color:#a890a8;
    padding:8px 0 4px;
    letter-spacing:1px;
  }
  .chart-summary.all-done{
    color:#e8a000;
    animation:summaryPop .8s ease;
  }
  @keyframes summaryPop{
    0%{transform:scale(1);}
    40%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }

  /* かな詳細モーダル */
  .modal-bg{
    position:fixed;inset:0;z-index:220;
    background:rgba(60,40,20,.55);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    animation:modalFade .25s ease-out;
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
  }
  @keyframes modalFade{from{opacity:0;}to{opacity:1;}}
  .modal-card{
    background:linear-gradient(180deg,#fffbf0 0%,#ffe8f5 100%);
    border-radius:32px;border:6px solid #fff;
    padding:30px 26px 26px;text-align:center;
    max-width:340px;width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 8px rgba(255,255,255,.25);
    animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  @keyframes popIn{
    from{transform:scale(.6) rotate(-8deg);opacity:0;}
    to{transform:scale(1) rotate(0);opacity:1;}
  }
  .kana-detail-char{
    font-size:clamp(72px,22vw,110px);
    font-weight:900;
    color:#ff6b9d;
    line-height:1;
    text-shadow:3px 3px 0 #ffe0ec;
    font-family:"Hiragino Maru Gothic ProN",Meiryo,sans-serif;
  }
  .kana-detail-emoji{
    font-size:clamp(64px,20vw,96px);
    line-height:1;
    margin:6px 0 4px;
    animation:float 2s ease-in-out infinite;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .kana-detail-emoji svg{width:1em;height:1em;display:block;}
  .kana-detail-text{
    font-size:clamp(16px,4.8vw,21px);
    font-weight:900;
    color:#5b4a38;
    letter-spacing:1px;
    margin:6px 0 4px;
  }
  .kana-detail-count{
    font-size:clamp(12px,3.5vw,14px);
    font-weight:800;
    color:#a890a8;
    margin-top:2px;
  }
  .modal-close{
    position:absolute;top:-16px;right:-16px;
    width:52px;height:52px;border-radius:50%;
    border:5px solid #fff;color:#fff;
    font-size:24px;font-weight:900;
    cursor:pointer;font-family:inherit;padding:0;
    line-height:1;
    background:linear-gradient(180deg,#ffb74d,#ff8a3d);
    box-shadow:0 6px 0 #d96a1f,0 10px 20px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;
  }
  .modal-close:active{transform:translateY(5px);box-shadow:0 1px 0 #d96a1f;}
  .modal-speaker{
    position:absolute;top:-16px;left:-16px;
    width:52px;height:52px;border-radius:50%;
    border:5px solid #fff;color:#fff;
    font-size:22px;font-weight:900;
    cursor:pointer;font-family:inherit;padding:0;
    line-height:1;
    background:linear-gradient(180deg,#7fd6ff,#4ab3e8);
    box-shadow:0 6px 0 #2a8ec4,0 10px 20px rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;
  }
  .modal-speaker:active{transform:translateY(5px);box-shadow:0 1px 0 #2a8ec4;}

  @media (max-width:360px){
    .icon-btn{width:42px;height:42px;font-size:20px;}
    .hud{padding:6px 8px;gap:4px;}
    .stars{padding:4px 12px 4px 10px;gap:4px;}
    .modal-close,.modal-speaker{width:48px;height:48px;font-size:22px;}
  }
  @media (prefers-reduced-motion: reduce){
    .kana-card.hint,.basket.happy,.replay-icon,.sticker-option,.select-header,
    .kana-detail-emoji,.kana-cell.count-5plus{animation:none!important;}
  }
</style>
</head>
<body>

<!-- ゲーム画面 -->
<div id="gameScreen" class="screen">
  <header class="hud">
    <button id="homeBtn" class="icon-btn" aria-label="おうちへ">🏠</button>
    <div class="hud-center">
      <div class="stars">
        <span class="star-icon">⭐</span>
        <span id="starCount">0</span>
        <span class="sticker-progress" id="progressDots"></span>
      </div>
    </div>
    <button id="chartBtn" class="icon-btn" aria-label="ひらがなちょう">📔</button>
    <button id="bookBtn" class="icon-btn" aria-label="シール帳">
      📖<span class="badge" id="bookBadge">0</span>
    </button>
  </header>

  <div class="kana-question" id="kanaQuestion">
    <div class="replay-icon">🔊</div>
    <div class="kana-display">
      <div class="kana-char" id="kanaChar">り</div>
      <div class="kana-hint" id="kanaHint">りんごの り</div>
    </div>
  </div>

  <div class="playfield" id="playfield">
    <div class="basket" id="basket">🧺</div>
  </div>
</div>

<!-- ひらがな帳 -->
<div id="kanaChartScreen" class="screen hidden">
  <header class="chart-header">
    <button id="closeChartBtn" class="icon-btn" aria-label="とじる">✖</button>
    <div class="chart-title">📔 ひらがなちょう</div>
    <div style="width:46px;flex:0 0 auto;"></div>
  </header>
  <main class="chart-main">
    <div class="kana-chart-grid" id="kanaChartGrid"></div>
  </main>
  <div class="chart-summary" id="chartSummary"></div>
</div>

<!-- シール選択画面 -->
<div id="stickerSelectScreen" class="screen hidden">
  <div class="select-header">シールを えらんでね！</div>
  <div class="select-sub">すきな シールを 1つ タップしてね</div>
  <div class="sticker-options" id="stickerOptions"></div>
</div>

<!-- かな詳細モーダル -->
<div id="kanaDetailModal" class="modal-bg hidden">
  <div class="modal-card" id="kanaDetailCard">
    <button class="modal-speaker" id="kanaDetailSpeakerBtn" aria-label="もういちど きく">🔊</button>
    <button class="modal-close" id="kanaDetailCloseBtn" aria-label="とじる">✖</button>
    <div class="kana-detail-char" id="kanaDetailChar">り</div>
    <div class="kana-detail-emoji" id="kanaDetailEmoji">🍎</div>
    <div class="kana-detail-text" id="kanaDetailText">りんごの り</div>
    <div class="kana-detail-count" id="kanaDetailCount">あそんだ かいすう：0 かい</div>
  </div>
</div>

<div id="bubble" class="bubble" role="status" aria-live="polite"></div>

<!-- 共通モジュール -->
<script src="../shared/momo.js"></script>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  /* =========================================================
     アイコンヘルパー（絵文字 + SVG 両対応）
     ========================================================= */
  function isSvg(val){
    return typeof val === 'string' && val.indexOf('<svg') === 0;
  }
  function setIcon(el, val){
    if (val == null) val = '';
    if (isSvg(val)){
      el.innerHTML = val;
    } else {
      el.textContent = val;
    }
  }

  /* =========================================================
     ルビーの手描きSVG（赤い宝石）
     ========================================================= */
  var RUBY_SVG = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+
    '<polygon points="50,8 85,32 50,92 15,32" fill="#c81540"/>'+
    '<polygon points="50,8 75,22 60,30 40,30 25,22" fill="#ff5577"/>'+
    '<polygon points="50,8 60,30 50,33 40,30" fill="#ff8899"/>'+
    '<polygon points="25,22 75,22 85,32 60,38 40,38 15,32" fill="#e61a44"/>'+
    '<polygon points="15,32 40,38 50,92" fill="#a10a32"/>'+
    '<polygon points="85,32 60,38 50,92" fill="#b01035"/>'+
    '<polygon points="40,38 50,38 50,92" fill="#8a0828"/>'+
    '<polygon points="50,38 60,38 50,92" fill="#9a0a2c"/>'+
    '<polygon points="50,8 60,30 40,30" fill="#ff8899" opacity="0.6"/>'+
    '<circle cx="38" cy="20" r="1.8" fill="#fff" opacity="0.9"/>'+
    '<circle cx="62" cy="20" r="1.4" fill="#fff" opacity="0.75"/>'+
    '<circle cx="45" cy="55" r="1.2" fill="#ffd0d8" opacity="0.7"/>'+
    '</svg>';

  /* =========================================================
     定数
     ========================================================= */
  var STICKERS_PER_UNLOCK = 3;
  var PROGRESS_KEY = 'momo_hiragana_progress_v1';

  var TIMING = {
    STICKER_BACK: 2400,
    BUBBLE: 1400
  };

  var REDUCED_MOTION = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ひらがなデータ（清音46字） */
  var KANA_DATA = [
    { kana:'あ', word:'あり', emoji:'🐜' },
    { kana:'い', word:'いちご', emoji:'🍓' },
    { kana:'う', word:'うさぎ', emoji:'🐰' },
    { kana:'え', word:'えび', emoji:'🦐' },
    { kana:'お', word:'おにぎり', emoji:'🍙' },
    { kana:'か', word:'かさ', emoji:'☂️' },
    { kana:'き', word:'きりん', emoji:'🦒' },
    { kana:'く', word:'くるま', emoji:'🚗' },
    { kana:'け', word:'けーき', emoji:'🍰' },
    { kana:'こ', word:'こあら', emoji:'🐨' },
    { kana:'さ', word:'さかな', emoji:'🐟' },
    { kana:'し', word:'しまうま', emoji:'🦓' },
    { kana:'す', word:'すいか', emoji:'🍉' },
    { kana:'せ', word:'せっけん', emoji:'🧼' },
    { kana:'そ', word:'そら', emoji:'☁️' },
    { kana:'た', word:'たいこ', emoji:'🥁' },
    { kana:'ち', word:'ちょうちょ', emoji:'🦋' },
    { kana:'つ', word:'つき', emoji:'🌙' },
    { kana:'て', word:'てがみ', emoji:'✉️' },
    { kana:'と', word:'とけい', emoji:'⏰' },
    { kana:'な', word:'なす', emoji:'🍆' },
    { kana:'に', word:'にんじん', emoji:'🥕' },
    { kana:'ぬ', word:'ぬいぐるみ', emoji:'🧸' },
    { kana:'ね', word:'ねこ', emoji:'🐱' },
    { kana:'の', word:'のこぎり', emoji:'🪚' },
    { kana:'は', word:'はな', emoji:'🌸' },
    { kana:'ひ', word:'ひこうき', emoji:'✈️' },
    { kana:'ふ', word:'ふうせん', emoji:'🎈' },
    { kana:'へ', word:'へび', emoji:'🐍' },
    { kana:'ほ', word:'ほし', emoji:'⭐' },
    { kana:'ま', word:'まど', emoji:'🪟' },
    { kana:'み', word:'みかん', emoji:'🍊' },
    { kana:'む', word:'むし', emoji:'🐛' },
    { kana:'め', word:'めがね', emoji:'👓' },
    { kana:'も', word:'もも', emoji:'🍑' },
    { kana:'や', word:'やま', emoji:'⛰️' },
    { kana:'ゆ', word:'ゆき', emoji:'⛄' },
    { kana:'よ', word:'よつば', emoji:'🍀' },
    { kana:'ら', word:'らいおん', emoji:'🦁' },
    { kana:'り', word:'りんご', emoji:'🍎' },
    { kana:'る', word:'るびー', emoji:RUBY_SVG },
    { kana:'れ', word:'れもん', emoji:'🍋' },
    { kana:'ろ', word:'ろうそく', emoji:'🕯️' },
    { kana:'わ', word:'わに', emoji:'🐊' },
    { kana:'を', word:'じをかく', emoji:'✍️' },
    { kana:'ん', word:'ぱんだ', emoji:'🐼' }
  ];

  /* =========================================================
     読み上げ専用マップ
     音声合成が助詞として誤解釈する文字をカタカナに置換
     ========================================================= */
  var KANA_SPEAK_MAP = {
    'は': 'ハ',
    'へ': 'ヘ',
    'を': 'ヲ'
  };
  function getKanaSpeech(kana){
    return KANA_SPEAK_MAP[kana] || kana;
  }

  /* ひらがな帳のレイアウト */
  var KANA_ROWS = [
    ['あ','い','う','え','お'],
    ['か','き','く','け','こ'],
    ['さ','し','す','せ','そ'],
    ['た','ち','つ','て','と'],
    ['な','に','ぬ','ね','の'],
    ['は','ひ','ふ','へ','ほ'],
    ['ま','み','む','め','も'],
    ['や',null,'ゆ',null,'よ'],
    ['ら','り','る','れ','ろ'],
    ['わ',null,null,null,'を'],
    ['ん',null,null,null,null]
  ];

  var KANA_STARTERS = ['り','く','ね','さ','と','は'];

  var HIRAGANA_STICKER_POOL = [
    '🐳','🐬','🦈','🐙','🦑','🦀','🦞','🐚','🐠','🐡',
    '☁️','🌤️','🌦️','⛈️','🌪️','❄️','💧','🌊',
    '🦄','🐉','🧚','🧜‍♀️','🧝','🏰','👑','🗡️','🛡️','💎','🔮','🪄',
    '🎹','🎸','🎺','🥁','🎻','🎷',
    '🌲','🌴','🍄','🌵'
  ];

  var PRAISE = ['せいかい！', 'すごい！', 'やったね！', 'じょうず！', 'あたり！'];

  /* =========================================================
     学習進捗
     ========================================================= */
  var progress = {
    counts: {},
    totalPlayed: 0,
    uniqueKana: 0
  };

  function loadProgress(){
    try {
      var raw = localStorage.getItem(PROGRESS_KEY);
      if (raw){
        var obj = JSON.parse(raw);
        if (obj && typeof obj === 'object'){
          if (obj.counts && typeof obj.counts === 'object') progress.counts = obj.counts;
          if (typeof obj.totalPlayed === 'number') progress.totalPlayed = obj.totalPlayed;
          if (typeof obj.uniqueKana === 'number') progress.uniqueKana = obj.uniqueKana;
        }
      }
    } catch(e){}
  }
  function saveProgress(){
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch(e){}
  }
  function incrementKanaCount(kana){
    progress.counts[kana] = (progress.counts[kana] || 0) + 1;
    progress.totalPlayed++;
    var unique = 0;
    for (var key in progress.counts){
      if (progress.counts[key] > 0) unique++;
    }
    progress.uniqueKana = unique;
    saveProgress();
  }

  function getWeight(count){
    if (count === 0) return 10;
    if (count === 1) return 6;
    if (count === 2) return 3;
    if (count === 3) return 2;
    return 1;
  }

  function pickWeightedKana(prevKana){
    var pool = [];
    KANA_DATA.forEach(function(k){
      if (k.kana === prevKana) return;
      var count = progress.counts[k.kana] || 0;
      var w = getWeight(count);
      for (var i = 0; i < w; i++) pool.push(k);
    });
    if (pool.length === 0){
      pool = KANA_DATA.slice();
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  /* =========================================================
     状態
     ========================================================= */
  var state = {
    stars: 0,
    totalCorrect: 0,
    level: 1,
    qCount: 0,
    current: null,
    locked: false,
    wrongStreak: 0,
    correctSinceSticker: 0,
    usedKana: [],
    cards: [],
    draggingCard: null,
    pendingStickers: null,
    myStickers: []
  };

  /* 起動時にシール履歴を取得 */
  state.myStickers = Momo.getMyStickerEmojis('hiragana');

  /* =========================================================
     問題生成
     ========================================================= */
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function newQuestion(){
    Momo.cancelSpeech();
    state.locked = false;
    state.wrongStreak = 0;
    state.qCount++;

    var kana;
    if (state.qCount <= 2){
      var starters = KANA_DATA.filter(function(k){ return KANA_STARTERS.indexOf(k.kana) >= 0; });
      var unused = starters.filter(function(k){ return state.usedKana.indexOf(k.kana) < 0; });
      kana = unused.length > 0 ? pick(unused) : pick(starters);
    } else {
      var prev = state.current ? state.current.kana : null;
      kana = pickWeightedKana(prev);
    }
    state.usedKana.push(kana.kana);
    state.current = kana;

    var others = KANA_DATA.filter(function(k){ return k.kana !== kana.kana; });
    shuffle(others);
    var numChoices = state.level >= 2 ? 4 : 3;
    var choices = [kana];
    for (var i = 0; i < numChoices - 1 && i < others.length; i++) choices.push(others[i]);
    shuffle(choices);

    renderQuestion(choices);

    setTimeout(function(){
      var sk = getKanaSpeech(kana.kana);
      var text = sk + '。' + kana.word + 'の ' + sk;
      Momo.speak(text, 0.85);
      var q = $('#kanaQuestion');
      q.classList.add('playing');
      setTimeout(function(){ q.classList.remove('playing'); }, 2200);
    }, 450);
  }

  function renderQuestion(choices){
    state.cards.forEach(function(c){ if (c.el.parentNode) c.el.parentNode.removeChild(c.el); });
    state.cards = [];
    state.draggingCard = null;

    $('#kanaChar').textContent = state.current.kana;
    $('#kanaHint').textContent = state.current.word + 'の ' + state.current.kana;

    var playfield = $('#playfield');
    choices.forEach(function(choice){
      var el = document.createElement('div');
      el.className = 'kana-card';
      var inner = document.createElement('div');
      inner.className = 'kana-card-inner';
      setIcon(inner, choice.emoji);
      el.appendChild(inner);
      playfield.appendChild(el);

      var card = {
        el: el, data: choice,
        x: 0, y: 0, vx: 0, vy: 0,
        minX: 0, minY: 0, maxX: 0, maxY: 0,
        dragging: false, paused: false
      };
      state.cards.push(card);
      attachCardHandlers(card);
    });

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        computeFloatBounds();
        state.cards.forEach(function(card){
          card.x = card.minX + Math.random() * Math.max(1, (card.maxX - card.minX));
          card.y = card.minY + Math.random() * Math.max(1, (card.maxY - card.minY));
          var angle = Math.random() * Math.PI * 2;
          var speed = 22 + Math.random() * 26;
          card.vx = Math.cos(angle) * speed;
          card.vy = Math.sin(angle) * speed;
          updateCardPosition(card);
        });
      });
    });
  }

  /* =========================================================
     カードの浮遊
     ========================================================= */
  var floatingLastTime = 0;

  function computeFloatBounds(){
    var pf = $('#playfield');
    var basket = $('#basket');
    var pfRect = pf.getBoundingClientRect();
    var basketRect = basket.getBoundingClientRect();
    var basketTopInPf = basketRect.top - pfRect.top;

    state.cards.forEach(function(card){
      var w = card.el.offsetWidth || 80;
      var h = card.el.offsetHeight || 80;
      card.minX = 6;
      card.maxX = Math.max(card.minX + 2, pfRect.width - w - 6);
      card.minY = 6;
      card.maxY = Math.max(card.minY + 2, basketTopInPf - h - 6);
      if (card.x < card.minX) card.x = card.minX;
      if (card.x > card.maxX) card.x = card.maxX;
      if (card.y < card.minY) card.y = card.minY;
      if (card.y > card.maxY) card.y = card.maxY;
    });
  }

  function updateCardPosition(card){
    card.el.style.transform = 'translate(' + card.x + 'px, ' + card.y + 'px)';
  }

  function floatingLoop(time){
    var visible = !$('#gameScreen').classList.contains('hidden');
    if (visible){
      var dt = floatingLastTime ? Math.min((time - floatingLastTime) / 1000, 0.05) : 0.016;
      state.cards.forEach(function(card){
        if (card.dragging || card.paused) return;
        card.x += card.vx * dt;
        card.y += card.vy * dt;
        if (card.x < card.minX){ card.x = card.minX; card.vx = Math.abs(card.vx); }
        if (card.x > card.maxX){ card.x = card.maxX; card.vx = -Math.abs(card.vx); }
        if (card.y < card.minY){ card.y = card.minY; card.vy = Math.abs(card.vy); }
        if (card.y > card.maxY){ card.y = card.maxY; card.vy = -Math.abs(card.vy); }
        updateCardPosition(card);
      });
    }
    floatingLastTime = time;
    requestAnimationFrame(floatingLoop);
  }

  /* =========================================================
     ドラッグ操作
     ========================================================= */
  function attachCardHandlers(card){
    card.el.addEventListener('pointerdown', function(e){
      if (state.locked || state.draggingCard) return;
      e.preventDefault();
      e.stopPropagation();

      state.draggingCard = card;
      card.dragging = true;
      card.el.classList.add('grabbed');
      card.el.style.zIndex = '100';

      try { card.el.setPointerCapture(e.pointerId); } catch(err){}

      var pfRect = $('#playfield').getBoundingClientRect();
      var cardRect = card.el.getBoundingClientRect();
      card._pfLeft = pfRect.left;
      card._pfTop = pfRect.top;
      card._dragOffX = e.clientX - cardRect.left;
      card._dragOffY = e.clientY - cardRect.top;

      Momo.sfx.grab();
    });

    card.el.addEventListener('pointermove', function(e){
      if (state.draggingCard !== card) return;
      e.preventDefault();
      var x = e.clientX - card._pfLeft - card._dragOffX;
      var y = e.clientY - card._pfTop - card._dragOffY;
      card.x = x;
      card.y = y;
      updateCardPosition(card);
      var over = isOverBasket(card);
      $('#basket').classList.toggle('hover', over);
    });

    card.el.addEventListener('pointerup', function(e){
      if (state.draggingCard !== card) return;
      e.preventDefault();
      card.el.classList.remove('grabbed');
      card.dragging = false;
      state.draggingCard = null;
      $('#basket').classList.remove('hover');
      card.el.style.zIndex = '1';

      if (isOverBasket(card)) evaluateCard(card);
      else resumeFloating(card);
    });

    card.el.addEventListener('pointercancel', function(e){
      if (state.draggingCard !== card) return;
      card.el.classList.remove('grabbed');
      card.dragging = false;
      state.draggingCard = null;
      $('#basket').classList.remove('hover');
      card.el.style.zIndex = '1';
      resumeFloating(card);
    });
  }

  function isOverBasket(card){
    var basket = $('#basket');
    var bRect = basket.getBoundingClientRect();
    var cRect = card.el.getBoundingClientRect();
    var cx = cRect.left + cRect.width / 2;
    var cy = cRect.top + cRect.height / 2;
    return cx >= bRect.left && cx <= bRect.right &&
           cy >= bRect.top && cy <= bRect.bottom;
  }

  function resumeFloating(card){
    var pf = $('#playfield');
    var pfRect = pf.getBoundingClientRect();
    var w = card.el.offsetWidth || 80;
    var h = card.el.offsetHeight || 80;
    card.minX = 6;
    card.maxX = Math.max(card.minX + 2, pfRect.width - w - 6);
    var basketRect = $('#basket').getBoundingClientRect();
    var basketTopInPf = basketRect.top - pfRect.top;
    card.minY = 6;
    card.maxY = Math.max(card.minY + 2, basketTopInPf - h - 6);

    card.x = Math.max(card.minX, Math.min(card.maxX, card.x));
    card.y = Math.max(card.minY, Math.min(card.maxY, card.y));
    updateCardPosition(card);

    var angle = Math.random() * Math.PI * 2;
    var speed = 22 + Math.random() * 26;
    card.vx = Math.cos(angle) * speed;
    card.vy = Math.sin(angle) * speed;
    card.paused = false;
  }

  /* =========================================================
     判定
     ========================================================= */
  function evaluateCard(card){
    if (state.locked) return;
    var isCorrect = card.data.kana === state.current.kana;

    if (isCorrect){
      state.locked = true;
      Momo.sfx.correct();
      Momo.sfx.star();
      $('#basket').classList.add('happy');
      setTimeout(function(){ $('#basket').classList.remove('happy'); }, 700);
      confetti(20);

      incrementKanaCount(state.current.kana);

      var pfRect = $('#playfield').getBoundingClientRect();
      var bRect = $('#basket').getBoundingClientRect();
      var targetX = bRect.left + bRect.width/2 - pfRect.left - card.el.offsetWidth/2;
      var targetY = bRect.top + bRect.height/2 - pfRect.top - card.el.offsetHeight/2;
      card.paused = true;
      card.el.style.transition = 'transform 0.55s cubic-bezier(0.55, 0, 0.7, 0.2), opacity 0.55s ease-in';
      card.el.style.transform = 'translate(' + targetX + 'px, ' + targetY + 'px) scale(0.2) rotate(20deg)';
      card.el.style.opacity = '0';

      state.stars++;
      state.totalCorrect++;
      state.correctSinceSticker++;
      updateStars();
      updateProgress();
      showBubble(pick(PRAISE));

      var wasLevelUp = (state.totalCorrect % 4 === 0 && state.level < 3);
      if (wasLevelUp) state.level++;
      var earned = state.correctSinceSticker >= STICKERS_PER_UNLOCK;

      var kana = state.current.kana, word = state.current.word;

      setTimeout(function(){
        var sk = getKanaSpeech(kana);
        Momo.speakWithEnd(sk + '。' + word + 'の ' + sk, function(){
          if (wasLevelUp){
            Momo.sfx.levelUp();
            showBubble('レベルアップ！');
            confetti(30);
            setTimeout(function(){
              Momo.speakWithEnd('れべるあっぷ！', function(){
                finishTurn(earned);
              });
            }, 550);
          } else {
            finishTurn(earned);
          }
        }, 0.95);
      }, 700);

    } else {
      Momo.sfx.wrong();
      card.el.classList.add('wrong');
      state.wrongStreak++;
      setTimeout(function(){ card.el.classList.remove('wrong'); }, 700);

      setTimeout(function(){
        resumeFloating(card);
        state.locked = false;
        if (state.wrongStreak >= 2){
          hintCorrectCard();
        }
      }, 750);
    }
  }

  function hintCorrectCard(){
    var correct = state.cards.find(function(c){ return c.data.kana === state.current.kana; });
    if (!correct) return;
    correct.el.classList.add('hint');
    setTimeout(function(){ correct.el.classList.remove('hint'); }, 2200);
  }

  function finishTurn(earned){
    if (earned) showStickerSelect();
    else newQuestion();
  }

  /* =========================================================
     星・進捗
     ========================================================= */
  function updateStars(){
    $('#starCount').textContent = state.stars;
    var el = document.querySelector('.stars');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  function updateProgress(){
    var dots = document.querySelectorAll('#progressDots .dot');
    dots.forEach(function(d, i){
      d.classList.toggle('filled', i < state.correctSinceSticker);
    });
  }

  /* =========================================================
     吹き出し・紙吹雪
     ========================================================= */
  var bubbleTimer = null;
  function showBubble(text){
    var b = $('#bubble');
    b.textContent = text;
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ b.classList.remove('show'); }, TIMING.BUBBLE);
  }
  function confetti(count){
    if (REDUCED_MOTION) count = Math.min(count, 8);
    var kinds = ['⭐','✨','🌸','🎉','💖','🍬','🌈','🎈'];
    for (var i = 0; i < count; i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = pick(kinds);
      el.style.left = (Math.random() * 96) + 'vw';
      el.style.fontSize = (14 + Math.random() * 22) + 'px';
      el.style.animationDuration = (1.7 + Math.random() * 1.3) + 's';
      el.style.animationDelay = (Math.random() * 0.35) + 's';
      document.body.appendChild(el);
      (function(node){ setTimeout(function(){ node.remove(); }, 3600); })(el);
    }
  }

  /* =========================================================
     シール選択
     ========================================================= */
  function showStickerSelect(){
    state.locked = false;
    Momo.cancelSpeech();

    var unowned = HIRAGANA_STICKER_POOL.filter(function(s){ return state.myStickers.indexOf(s) === -1; });
    var pool = unowned.length >= STICKERS_PER_UNLOCK ? unowned : HIRAGANA_STICKER_POOL.slice();
    shuffle(pool);
    state.pendingStickers = pool.slice(0, STICKERS_PER_UNLOCK);

    var cont = $('#stickerOptions');
    cont.innerHTML = '';

    state.pendingStickers.forEach(function(st, i){
      var card = document.createElement('button');
      card.className = 'sticker-option';
      card.type = 'button';
      card.textContent = st;
      card.style.animationDelay = (i * 0.13) + 's';
      card.addEventListener('click', function(){ chooseSticker(st, card); });
      cont.appendChild(card);
    });

    $('#stickerSelectScreen').classList.remove('hidden');
    Momo.duckBGM(true);
    setTimeout(function(){ Momo.speak('シールを えらんでね'); }, 500);
  }

  function chooseSticker(sticker, card){
    if (state.locked) return;
    state.locked = true;

    document.querySelectorAll('.sticker-option').forEach(function(c){
      c.style.pointerEvents = 'none';
      if (c !== card) c.classList.add('fade-out');
    });
    card.classList.add('chosen');

    Momo.sfx.levelUp();
    confetti(30);

    Momo.saveSticker(sticker, 'hiragana');
    state.myStickers.push(sticker);
    state.correctSinceSticker = 0;
    updateProgress();
    Momo.updateBookBadge();

    setTimeout(function(){ showBubble('シール ゲット！'); }, 200);
    setTimeout(function(){ Momo.speak('シール ゲット'); }, 450);

    setTimeout(function(){
      $('#stickerSelectScreen').classList.add('hidden');
      Momo.duckBGM(false);
      state.locked = false;
      newQuestion();
    }, TIMING.STICKER_BACK);
  }

  /* =========================================================
     ひらがな帳
     ========================================================= */
  function openChart(){
    renderChart();
    $('#kanaChartScreen').classList.remove('hidden');
    Momo.duckBGM(true);
    Momo.cancelSpeech();
    setTimeout(function(){ Momo.speak('あそんだ もじが ふえて いくよ', 0.95); }, 300);
  }
  function closeChart(){
    $('#kanaChartScreen').classList.add('hidden');
    Momo.duckBGM(false);
    Momo.cancelSpeech();
  }

  function renderChart(){
    var grid = $('#kanaChartGrid');
    grid.innerHTML = '';

    KANA_ROWS.forEach(function(row){
      row.forEach(function(kana){
        var cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'kana-cell';

        if (kana === null){
          cell.classList.add('empty');
          cell.disabled = true;
          cell.tabIndex = -1;
        } else {
          var count = progress.counts[kana] || 0;
          if (count === 0) cell.classList.add('count-0');
          else if (count <= 2) cell.classList.add('count-1-2');
          else if (count <= 4) cell.classList.add('count-3-4');
          else cell.classList.add('count-5plus');

          cell.textContent = kana;
          cell.setAttribute('aria-label', kana);

          (function(k){
            cell.addEventListener('click', function(){
              Momo.sfx.tap();
              showKanaDetail(k);
            });
          })(kana);
        }
        grid.appendChild(cell);
      });
    });

    var total = progress.uniqueKana;
    var maxTotal = KANA_DATA.length;
    var summary = $('#chartSummary');
    if (total >= maxTotal){
      summary.textContent = '🎉 ぜんぶの もじ あそんだね！ すごい！';
      summary.classList.add('all-done');
    } else {
      summary.textContent = '⭐ ' + total + ' / ' + maxTotal + ' もじ あそんだよ！';
      summary.classList.remove('all-done');
    }
  }

  /* =========================================================
     かな詳細モーダル
     ========================================================= */
  var currentDetailKana = null;

  function showKanaDetail(kana){
    var data = null;
    for (var i = 0; i < KANA_DATA.length; i++){
      if (KANA_DATA[i].kana === kana){ data = KANA_DATA[i]; break; }
    }
    if (!data) return;

    currentDetailKana = kana;
    $('#kanaDetailChar').textContent = data.kana;
    setIcon($('#kanaDetailEmoji'), data.emoji);
    $('#kanaDetailText').textContent = data.word + 'の ' + data.kana;

    var count = progress.counts[kana] || 0;
    $('#kanaDetailCount').textContent = 'あそんだ かいすう：' + count + ' かい';

    $('#kanaDetailModal').classList.remove('hidden');
    Momo.duckBGM(true);

    setTimeout(function(){
      var sk = getKanaSpeech(data.kana);
      Momo.speak(data.word + 'の ' + sk, 0.85);
    }, 320);
  }

  function closeKanaDetail(){
    if (!currentDetailKana) return;
    currentDetailKana = null;
    $('#kanaDetailModal').classList.add('hidden');
    Momo.cancelSpeech();
    if ($('#kanaChartScreen').classList.contains('hidden')){
      Momo.duckBGM(false);
    }
  }

  /* =========================================================
     イベント
     ========================================================= */
  $('#homeBtn').addEventListener('click', function(){
    Momo.sfx.tap();
    Momo.cancelSpeech();
    Momo.stopBGM();
    Momo.notifyParent('goHome');
  });

  $('#bookBtn').addEventListener('click', function(){
    Momo.sfx.tap();
    Momo.cancelSpeech();
    Momo.stopBGM();
    Momo.notifyParent({ type: 'openBook', from: 'hiragana' });
  });

  $('#chartBtn').addEventListener('click', function(){
    Momo.sfx.tap();
    openChart();
  });
  $('#closeChartBtn').addEventListener('click', function(){
    Momo.sfx.tap();
    closeChart();
  });

  $('#kanaQuestion').addEventListener('click', function(){
    if (!state.current) return;
    Momo.sfx.tap();
    var sk = getKanaSpeech(state.current.kana);
    var text = sk + '。' + state.current.word + 'の ' + sk;
    Momo.speak(text, 0.85);
    var q = $('#kanaQuestion');
    q.classList.add('playing');
    setTimeout(function(){ q.classList.remove('playing'); }, 2200);
  });

  $('#kanaDetailCloseBtn').addEventListener('click', function(e){
    e.stopPropagation();
    Momo.sfx.tap();
    closeKanaDetail();
  });
  $('#kanaDetailSpeakerBtn').addEventListener('click', function(e){
    e.stopPropagation();
    if (!currentDetailKana) return;
    var data = null;
    for (var i = 0; i < KANA_DATA.length; i++){
      if (KANA_DATA[i].kana === currentDetailKana){ data = KANA_DATA[i]; break; }
    }
    if (!data) return;
    Momo.sfx.star();
    var sk = getKanaSpeech(data.kana);
    Momo.speak(data.word + 'の ' + sk, 0.85);
  });
  $('#kanaDetailModal').addEventListener('click', function(e){
    if (e.target === this) closeKanaDetail();
  });
  $('#kanaDetailCard').addEventListener('click', function(e){ e.stopPropagation(); });

  window.addEventListener('resize', function(){
    computeFloatBounds();
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(computeFloatBounds, 250);
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      Momo.stopBGM();
      Momo.cancelSpeech();
    } else {
      if (Momo.settings.soundOn) Momo.startBGM();
    }
  });

  /* =========================================================
     起動
     ========================================================= */
  (function buildDots(){
    var box = $('#progressDots');
    box.innerHTML = '';
    for (var i = 0; i < STICKERS_PER_UNLOCK; i++){
      var d = document.createElement('span');
      d.className = 'dot';
      box.appendChild(d);
    }
  })();

  Momo.init();
  Momo.updateBookBadge();

  loadProgress();

  updateStars();
  updateProgress();

  requestAnimationFrame(floatingLoop);

  setTimeout(newQuestion, 500);

})();
</script>
</body>
</html>
