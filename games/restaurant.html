<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>レストランごっこ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:linear-gradient(170deg,#fff8ec 0%,#ffeef5 50%,#eaf6ff 100%);
    color:#6b5568;display:flex;justify-content:center;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{
    width:min(96vw,480px);
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:calc(4px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }

  header{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:6px;flex:0 0 auto;
  }
  h1{
    margin:0;font-size:clamp(12px,3.6vw,15px);font-weight:800;
    color:#ff8fb0;
    text-shadow:0 1px 0 #fff,0 2px 4px rgba(255,150,190,.35);
    white-space:nowrap;
  }
  .mini{
    width:44px;height:44px;border-radius:50%;border:0;
    background:rgba(255,255,255,.92);
    box-shadow:0 2px 8px rgba(180,140,180,.28);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;flex:0 0 auto;
    transition:transform .1s;position:relative;
    font-family:inherit;font-size:22px;line-height:1;
  }
  .mini:active{transform:scale(.9);}
  .mini .badge{
    position:absolute;top:-3px;right:-3px;
    min-width:20px;height:20px;border-radius:10px;
    background:#ff6b9d;color:#fff;
    font-size:11px;font-weight:900;
    display:none;align-items:center;justify-content:center;
    padding:0 4px;border:2px solid #fff;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .mini .badge.show{display:flex;}

  #topRow{
    width:100%;display:flex;justify-content:center;align-items:center;
    gap:6px;flex:0 0 auto;flex-wrap:wrap;
  }
  #stars{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:1px;align-items:center;min-height:18px;
    font-size:clamp(13px,3.8vw,17px);line-height:1;
  }
  #stars .st{transition:transform .25s;display:inline-block;}
  #stars .st.pop{animation:starPop .5s ease;}
  @keyframes starPop{0%{transform:scale(1);}45%{transform:scale(1.7) rotate(20deg);}100%{transform:scale(1);}}
  #stars .more{font-size:clamp(10px,3vw,12px);font-weight:800;color:#ff8fb0;margin-left:2px;}

  #sales{
    display:flex;align-items:center;gap:4px;
    background:linear-gradient(160deg,#fff8e0,#ffe0a0);
    border:2px solid #ffc850;border-radius:999px;
    padding:2px 12px 2px 10px;
    font-size:clamp(12px,3.6vw,15px);font-weight:800;color:#8a5000;
    box-shadow:0 2px 0 rgba(220,160,60,.4);
    flex:0 0 auto;transition:transform .15s;
  }
  #sales .coin{font-size:1.15em;line-height:1;}
  #sales.bump{animation:salesBump .5s ease;}
  #sales.loss{animation:salesLoss .6s ease;}
  @keyframes salesBump{0%{transform:scale(1);}40%{transform:scale(1.25);}100%{transform:scale(1);}}
  @keyframes salesLoss{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}

  #orderCard{
    width:100%;background:#fff;border-radius:22px;
    padding:8px 10px 10px;
    box-shadow:0 3px 0 rgba(230,200,220,.5),0 6px 14px rgba(200,160,180,.18);
    flex:0 0 auto;display:flex;flex-direction:column;gap:6px;
  }
  .order-row-1{
    display:flex;align-items:center;gap:8px;min-height:0;
    cursor:pointer;border-radius:14px;transition:background .2s;
  }
  .order-row-1:active{background:#fff8fb;}
  #custIcon{
    width:clamp(48px,13vw,62px);height:clamp(48px,13vw,62px);
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(36px,10vw,50px);line-height:1;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));
  }
  #custIcon.happy{animation:happyBounce .55s ease infinite;}
  @keyframes happyBounce{0%,100%{transform:translateY(0) scale(1);}30%{transform:translateY(-7px) scale(1.08);}60%{transform:translateY(0) scale(1);}}
  #bubble{
    position:relative;flex:1 1 auto;min-width:0;
    background:#fff5f8;border-radius:14px;
    padding:6px 11px;
    font-size:clamp(12px,3.6vw,15px);font-weight:800;color:#8a6f85;
    text-align:left;line-height:1.15;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;
  }
  #bubble::before{
    content:'';position:absolute;left:-5px;top:50%;
    transform:translateY(-50%);
    border:5px solid transparent;border-right-color:#fff5f8;
  }
  #bubble.bounce{animation:bubbleBounce .35s ease;}
  @keyframes bubbleBounce{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  .order-row-2{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(4px,1.6vw,8px);
    padding-top:8px;border-top:2px dashed #ffd9e5;
  }
  #needRow{display:flex;gap:clamp(3px,1.2vw,6px);align-items:center;}
  #needRow .plus{font-size:clamp(18px,5.4vw,24px);color:#ff9ec0;font-weight:800;line-height:1;text-shadow:0 1px 0 #fff;}
  .need-chip{
    width:clamp(44px,12.5vw,56px);height:clamp(44px,12.5vw,56px);
    border-radius:32%;
    background:linear-gradient(160deg,#fffaf0,#fff0d8);
    border:2.5px solid #ffd9a8;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
    box-shadow:0 2px 0 rgba(230,180,140,.35);
    font-size:clamp(28px,8vw,38px);line-height:1;
    padding:6px;
  }
  .need-chip svg{width:100%;height:100%;display:block;}
  .equals{font-size:clamp(24px,7vw,32px);font-weight:800;color:#ff9ec0;line-height:1;margin:0 2px;text-shadow:0 1px 0 #fff;}
  #dishWrap{position:relative;flex:0 0 auto;}
  #dishIcon{
    width:clamp(56px,15.5vw,70px);height:clamp(56px,15.5vw,70px);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(40px,11vw,54px);line-height:1;
    filter:drop-shadow(0 3px 4px rgba(220,160,190,.3));
    padding:4px;
  }
  #dishIcon svg{width:100%;height:100%;display:block;}
  #priceTag{
    position:absolute;bottom:-4px;right:-8px;
    background:#ffd93d;color:#7a4a00;
    font-size:clamp(10px,2.9vw,12px);font-weight:800;
    padding:2px 7px;border-radius:999px;
    border:1.5px solid #fff;
    box-shadow:0 1px 3px rgba(180,140,60,.4);
    white-space:nowrap;pointer-events:none;line-height:1.2;
  }

  #cookArea{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;}
  #slots{display:flex;gap:8px;}
  .slot{
    width:clamp(34px,10vw,44px);height:clamp(34px,10vw,44px);
    border-radius:50%;border:2px dashed rgba(200,170,200,.55);
    background:rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,6vw,28px);line-height:1;
    transition:border-color .25s,background .25s,box-shadow .25s;
    padding:5px;
  }
  .slot svg{width:100%;height:100%;display:block;}
  .slot.filled{border:2px solid #fff;background:#fff;box-shadow:0 2px 0 rgba(220,180,200,.4),0 0 12px rgba(255,200,220,.6);}
  .slot.pop{animation:slotPop .4s ease;}
  @keyframes slotPop{0%{transform:scale(.4);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
  .slot.wrong{
    border-color:#ff5252 !important;
    background:#fff0f0 !important;
    box-shadow:0 0 0 3px #ff5252,0 0 14px rgba(255,82,82,.7) !important;
    animation:wrongShake .4s ease;
  }
  @keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  #potWrap{position:relative;width:clamp(92px,26vw,118px);height:clamp(72px,20vw,94px);}
  #potWrap.shake{animation:potShake .35s ease-in-out 4;}
  @keyframes potShake{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-4px) rotate(-3deg);}75%{transform:translateX(4px) rotate(3deg);}}
  #pot{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(64px,19vw,88px);line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));
  }
  #pot svg{width:100%;height:100%;display:block;}
  #pot.cooking{animation:cookBob .4s ease-in-out infinite;}
  @keyframes cookBob{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-4px) scale(1.03);}}
  #dish{
    position:absolute;left:50%;top:46%;
    width:74%;height:74%;
    transform:translate(-50%,-50%) scale(0);opacity:0;
    pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(56px,17vw,78px);line-height:1;
    transition:opacity .35s,transform .45s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 5px 8px rgba(200,160,180,.45));
  }
  #dish svg{width:100%;height:100%;display:block;}
  #dish.show{opacity:1;transform:translate(-50%,-50%) scale(1);animation:dishPulse 1.1s ease-in-out infinite;pointer-events:auto;cursor:pointer;}
  @keyframes dishPulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.1);}}

  #ingredients{
    width:100%;display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(6px,2vw,10px);
    flex:0 0 auto;padding:2px 0 4px;
  }
  .ing-btn{
    width:100%;aspect-ratio:1/1.18;
    border-radius:22%;border:3px solid #fff;
    background:linear-gradient(160deg,#fffdf5,#fff0e0);
    box-shadow:0 4px 0 rgba(220,190,180,.45),0 6px 12px rgba(200,160,180,.18);
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6% 4% 4%;gap:2px;
    transition:transform .12s,box-shadow .12s,opacity .3s;
    touch-action:manipulation;font-family:inherit;
    min-height:0;
  }
  .ing-img{
    flex:1 1 auto;width:100%;min-height:0;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(36px,11vw,50px);line-height:1;
    padding:2%;
  }
  .ing-img svg{width:100%;height:100%;display:block;}
  .ing-name{
    flex:0 0 auto;
    font-size:clamp(11px,3.4vw,15px);font-weight:800;
    color:#8a6f85;line-height:1.05;letter-spacing:.02em;
    white-space:nowrap;
  }
  .ing-btn:active{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(220,190,180,.45);}
  .ing-btn.used{opacity:.15;transform:scale(.85);pointer-events:none;box-shadow:none;}

  .flyer{
    position:fixed;z-index:200;pointer-events:none;
    will-change:left,top,transform;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .flyer svg{width:100%;height:100%;display:block;}

  .bubble-fx{
    position:fixed;width:11px;height:11px;border-radius:50%;
    background:rgba(255,255,255,.95);
    border:2px solid rgba(255,205,225,.85);
    pointer-events:none;z-index:60;
    animation:bubbleUp 1.1s ease-out forwards;
    margin-left:-5.5px;
  }
  @keyframes bubbleUp{
    0%{transform:translateY(0) scale(.3);opacity:0;}
    25%{opacity:1;}
    100%{transform:translateY(-80px) scale(1.3);opacity:0;}
  }
  .heart-fx{
    position:fixed;pointer-events:none;z-index:80;
    animation:heartUp 1.3s ease-out forwards;
    font-size:22px;line-height:1;margin-left:-11px;
  }
  @keyframes heartUp{
    0%{transform:translateY(0) scale(.4);opacity:0;}
    20%{opacity:1;}
    100%{transform:translateY(-100px) scale(1.2) rotate(15deg);opacity:0;}
  }
  .money-fx{
    position:fixed;transform:translate(-50%,0);
    font-weight:800;font-size:clamp(14px,4.2vw,19px);
    pointer-events:none;z-index:90;
    animation:moneyUp 1.4s ease-out forwards;
    text-shadow:0 1px 0 #fff,0 2px 4px rgba(0,0,0,.1);
  }
  .money-fx.plus{color:#e8a000;}
  .money-fx.minus{color:#e84a4a;}
  @keyframes moneyUp{
    0%{transform:translate(-50%,0) scale(.5);opacity:0;}
    25%{opacity:1;transform:translate(-50%,-8px) scale(1.2);}
    100%{transform:translate(-50%,-70px) scale(1);opacity:0;}
  }

  .overlay{
    position:fixed;inset:0;z-index:500;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(170deg,rgba(255,248,236,.96),rgba(255,238,245,.96),rgba(234,246,255,.96));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    animation:fadeIn .3s ease;padding:16px;
  }
  .overlay[hidden]{display:none;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .win-card{
    background:#fff;border-radius:32px;
    padding:24px 30px;text-align:center;
    box-shadow:0 14px 44px rgba(180,140,190,.4);
    animation:popIn .45s cubic-bezier(.4,1.6,.5,1);
    max-width:90vw;
  }
  @keyframes popIn{
    0%{transform:scale(.7);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  .win-emoji{
    font-size:clamp(46px,15vw,70px);line-height:1;
    animation:winBounce .9s ease infinite;
  }
  @keyframes winBounce{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-8px) scale(1.12);}
  }
  .win-text{
    margin:12px 0 4px;
    font-size:clamp(18px,5vw,23px);font-weight:900;
    color:#ff8fb0;letter-spacing:1px;
  }
  .win-sub{
    margin:0;font-size:clamp(12px,3.4vw,14px);
    font-weight:800;color:#a890a8;
  }

  #stampBoxScreen{
    position:fixed;inset:0;z-index:520;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#fff0d8 0%,#ffe8d0 45%,#ffeedd 100%);
    padding:24px;gap:14px;text-align:center;overflow:hidden;
  }
  #stampBoxScreen[hidden]{display:none;}
  #stampBoxScreen::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 12% 18%,rgba(255,255,255,.5) 0 6px,transparent 7px),
      radial-gradient(circle at 88% 24%,rgba(255,255,255,.5) 0 8px,transparent 9px),
      radial-gradient(circle at 22% 82%,rgba(255,255,255,.5) 0 7px,transparent 8px),
      radial-gradient(circle at 78% 76%,rgba(255,255,255,.5) 0 6px,transparent 7px);
    pointer-events:none;
  }
  .select-header{
    font-size:clamp(20px,5.8vw,30px);font-weight:900;
    color:#c8855a;letter-spacing:2px;
    text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(220,160,120,.3);
    animation:floatyH 2.2s ease-in-out infinite;
    position:relative;z-index:2;
  }
  @keyframes floatyH{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .select-sub{
    font-size:clamp(12px,3.5vw,15px);
    color:#8a7058;font-weight:800;
    margin-top:-6px;position:relative;z-index:2;
  }
  .stamp-box{
    width:clamp(140px, 42vw, 200px);
    height:clamp(140px, 42vw, 200px);
    border-radius:28px;
    background:linear-gradient(180deg,#fff5e0,#ffdca8);
    border:6px solid #fff;
    box-shadow:0 10px 0 #d4a060, 0 16px 30px rgba(0,0,0,.2);
    display:flex;align-items:center;justify-content:center;
    position:relative;cursor:pointer;padding:0;
    font-family:inherit;margin-top:10px;
    transition:transform .1s, box-shadow .1s;
    overflow:hidden;z-index:2;
  }
  .stamp-box:not(.opened):active{
    transform:translateY(6px);
    box-shadow:0 4px 0 #d4a060, 0 8px 18px rgba(0,0,0,.2);
  }
  .stamp-box .box-emoji{
    font-size:clamp(78px, 24vw, 118px);line-height:1;
    transition:transform .3s, opacity .3s;display:block;
  }
  .stamp-box .box-stamp{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(78px, 24vw, 118px);line-height:1;
    opacity:0;transform:scale(0.3) rotate(-20deg);
    transition:opacity .3s, transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp-box.opened .box-emoji{transform:scale(0);opacity:0;}
  .stamp-box.opened .box-stamp{opacity:1;transform:scale(1) rotate(-6deg);}
  .stamp-box.shaking{animation:boxShake .5s ease;}
  @keyframes boxShake{
    0%,100%{transform:translateY(0) translateX(0) rotate(0);}
    20%{transform:translateY(0) translateX(-8px) rotate(-5deg);}
    40%{transform:translateY(0) translateX(8px) rotate(5deg);}
    60%{transform:translateY(0) translateX(-5px) rotate(-3deg);}
    80%{transform:translateY(0) translateX(5px) rotate(3deg);}
  }
  .box-stamp.hanko-red{ filter:url(#hanko-red); }
  .box-stamp.hanko-blue{ filter:url(#hanko-blue); }
  .box-stamp.hanko-green{ filter:url(#hanko-green); }

  .bubble-pop{
    position:fixed;left:50%;top:38%;
    transform:translate(-50%,-50%) scale(.4);
    background:#fff;color:#ff8fb0;font-weight:900;
    font-size:clamp(22px,6.5vw,38px);
    letter-spacing:2px;
    padding:14px 32px;border-radius:999px;
    border:5px solid #ffd9e6;
    box-shadow:0 8px 0 rgba(255,107,157,.35),0 14px 34px rgba(0,0,0,.2);
    pointer-events:none;z-index:600;opacity:0;white-space:nowrap;
  }
  .bubble-pop.show{animation:bubblePop 1.3s ease-out forwards;}
  @keyframes bubblePop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.14);}
    34%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-72%) scale(1);}
  }

  @media (prefers-reduced-motion: reduce){
    .win-emoji,.select-header,.stamp-box.shaking{animation:none!important;}
  }
</style>
</head>
<body>

<!-- ===== ハンコ風SVGフィルタ ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="hanko-red" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.82
        0 0 0 0 0.16
        0 0 0 0 0.16
        0 0 0 0.72 0
      "/>
    </filter>
    <filter id="hanko-blue" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.16
        0 0 0 0 0.42
        0 0 0 0 0.78
        0 0 0 0.72 0
      "/>
    </filter>
    <filter id="hanko-green" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.20
        0 0 0 0 0.62
        0 0 0 0 0.35
        0 0 0 0.72 0
      "/>
    </filter>
  </defs>
</svg>

<!-- クリア演出 -->
<div id="clearOverlay" class="overlay" hidden>
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <p class="win-text" id="clearText">5品 つくったよ！</p>
    <p class="win-sub">スタンプを もらおう！</p>
  </div>
</div>

<!-- スタンプ箱 -->
<div id="stampBoxScreen" hidden>
  <div class="select-header">スタンプ どうぞ！</div>
  <div class="select-sub">はこを タップして あけてね</div>
  <button class="stamp-box" id="stampBoxBtn" type="button" aria-label="スタンプのはこ">
    <span class="box-emoji">🎁</span>
    <span class="box-stamp" id="boxStamp"></span>
  </button>
</div>

<div id="bubblePop" class="bubble-pop" role="status" aria-live="polite"></div>

<div id="app">
  <header>
    <button id="homeBtn" class="mini" aria-label="おうちへ">🏠</button>
    <h1>🍳 レストランごっこ</h1>
    <button id="bookBtn" class="mini" aria-label="シール帳">
      📖<span class="badge" id="bookBadge">0</span>
    </button>
  </header>

  <div id="topRow">
    <div id="stars"></div>
    <div id="sales"><span class="coin">🪙</span><span id="salesValue">0円</span></div>
  </div>

  <div id="orderCard">
    <div class="order-row-1" id="orderTap">
      <div id="custIcon"></div>

/* 効果音の出力先を Momo から取得するヘルパー
   Momo.playNote の dest には AudioContext の destination を渡す必要があるため、
   Momo 内部に sfxGain がある想定で、それを直接使えない場合は
   destination を渡す形で Momo 側に統一APIを用意するのが理想。
   ここでは Momo が内部で sfxGain を保持している前提で、
   Momo.sfx経由では提供されない音を鳴らすための簡易ヘルパー。 */
function getSfxDest(){
  // Momo.playNote の第5引数 vol は使うが、dest には ctx.destination を使う必要がある
  // Momo 側に playNote が公開されているが、sfxGain に接続する必要がある
  // → ここでは簡易的に Momo.sfx 経由で似た音を鳴らすことにする
  return null;
}

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function flyIcon(fromRect, toRect, key, dur, onDone){
  var el = document.createElement('div');
  el.className = 'flyer';
  var val = ICONS[key] || key;
  var isS = isSvg(val);

  var ss = Math.max(fromRect.width, fromRect.height) * 0.9;
  var es = Math.max(toRect.width, toRect.height) * 1.05;

  el.style.left = (fromRect.left + fromRect.width/2 - ss/2) + 'px';
  el.style.top  = (fromRect.top  + fromRect.height/2 - ss/2) + 'px';
  el.style.width = ss + 'px';
  el.style.height = ss + 'px';

  if (isS){
    el.innerHTML = val;
  } else {
    el.textContent = val;
    el.style.fontSize = (ss * 0.9) + 'px';
  }

  document.body.appendChild(el);
  void el.offsetWidth;

  el.style.transition = 'all ' + dur + 'ms cubic-bezier(.35,1.35,.55,1)';

  el.style.left = (toRect.left + toRect.width/2 - es/2) + 'px';
  el.style.top  = (toRect.top  + toRect.height/2 - es/2) + 'px';
  el.style.width = es + 'px';
  el.style.height = es + 'px';

  if (!isS){
    el.style.fontSize = (es * 0.9) + 'px';
  }

  setTimeout(function(){ el.remove(); if (onDone) onDone(); }, dur + 20);
}
function say(text, opt){
  opt = opt || {};
  bubbleEl.textContent = text;
  bubbleEl.classList.remove('bounce');
  void bubbleEl.offsetWidth;
  bubbleEl.classList.add('bounce');
  if (opt.speak === false) return;
  var v = VOICE[state.customer] || {pitch:1.3, rate:1.0};
  if (opt.delay){
    setTimeout(function(){ Momo.speak(text, { voice: v }); }, opt.delay);
  } else {
    Momo.speak(text, { voice: v });
  }
}

    needRow.appendChild(chip);
  });

  for (var i = 0; i < slotEls.length; i++){
    slotEls[i].textContent = '';
    slotEls[i].innerHTML = '';
    slotEls[i].classList.remove('filled','pop','wrong');
  }
  dishEl.classList.remove('show');
  dishEl.innerHTML = '';
  dishEl.textContent = '';
  potEl.classList.remove('cooking');
  potWrap.classList.remove('shake');

  var distractors = ALL_ING.filter(function(k){ return state.recipe.need.indexOf(k) === -1; });
  shuffle(distractors);
  var options = state.recipe.need.concat(distractors.slice(0, DISTRACTORS));
  shuffle(options);

  ingEl.innerHTML = '';
  options.forEach(function(key){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ing-btn';
    btn.dataset.key = key;
    var img = document.createElement('div');
    img.className = 'ing-img';
    setIcon(img, key);
    var nm = document.createElement('div');
    nm.className = 'ing-name';
    nm.textContent = ING_NAME[key] || key;
    btn.appendChild(img);
    btn.appendChild(nm);
    btn.addEventListener('click', function(){ onTapIngredient(key, btn); });
    ingEl.appendChild(btn);
  });

  say(state.recipe.label + ' ちょうだい！');
}

function onTapIngredient(key, btn){
  if (state.phase !== 'idle') return;
  if (state.used[key]) return;
  Momo.sfx.tap();
  Momo.speak(ING_NAME[key] || key, { voice: ING_VOICE, queue: true });

  var slotIdx = -1;
  for (var i = 0; i < state.slotIngs.length; i++){
    if (state.slotIngs[i] === null){ slotIdx = i; break; }
  }
  if (slotIdx === -1) return;

  state.used[key] = true;
  state.slotIngs[slotIdx] = key;
  btn.classList.add('used');
  btn.disabled = true;

  var slot = slotEls[slotIdx];
  var fromRect = btn.getBoundingClientRect();
  var toRect = slot.getBoundingClientRect();
  var dur = 450;

  flyIcon(fromRect, toRect, key, dur, function(){
    setIcon(slot, key);
    slot.classList.add('filled');
    slot.classList.remove('pop');
    void slot.offsetWidth;
    slot.classList.add('pop');
    Momo.sfx.pop();
    if (state.slotIngs.indexOf(null) === -1){
      state.phase = 'checking';
      setTimeout(judge, 250);
    }
  });
}

function judge(){
  var need = state.recipe.need;
  var ok = state.slotIngs.length === need.length &&
           state.slotIngs.every(function(k){ return need.indexOf(k) !== -1; });
  if (ok) startCooking();
  else showFail();
}

function showFail(){
  Momo.sfx.wrong();
  potWrap.classList.add('shake');
  say('えーん、ちがうの ほしいな');

  for (var i = 0; i < slotEls.length; i++){
    var key = state.slotIngs[i];
    if (key === null || state.recipe.need.indexOf(key) === -1){
      slotEls[i].classList.add('wrong');
    }
  }
  setTimeout(function(){ changeSales(-PENALTY); }, 400);

  setTimeout(function(){
    for (var j = 0; j < slotEls.length; j++){
      slotEls[j].textContent = '';
      slotEls[j].innerHTML = '';
      slotEls[j].classList.remove('filled','pop','wrong');
    }
    state.slotIngs = [null,null,null];
    state.used = {};
    var btns = ingEl.querySelectorAll('.ing-btn');
    for (var k = 0; k < btns.length; k++){
      btns[k].classList.remove('used');
      btns[k].disabled = false;
    }
    potWrap.classList.remove('shake');
    state.phase = 'idle';
    say(state.recipe.label + ' ちょうだい！');
  }, 1500);
}

function startCooking(){
  state.phase = 'cooking';

  var saying = state.recipe.saying || 'ぐつぐつ…';
  say(saying, { speak:false });

  potEl.classList.add('cooking');
  sfxCook();

  var timer = setInterval(function(){ spawnBubbleFX(); }, 170);

  setTimeout(function(){
    clearInterval(timer);
    potEl.classList.remove('cooking');
    setIcon(dishEl, state.recipe.dish);
    dishEl.classList.add('show');
    say('わあ、おいしそう！ ちょうだい！');
    sfxDing();
    state.phase = 'ready';
  }, 1700);
}

dishEl.addEventListener('click', function(){
  if (state.phase !== 'ready') return;
  state.phase = 'eating';

  var fromRect = dishEl.getBoundingClientRect();
  var toRect = custIcon.getBoundingClientRect();
  var dur = 600;

  dishEl.classList.remove('show');
  dishEl.innerHTML = '';
  dishEl.textContent = '';
  flyIcon(fromRect, toRect, state.recipe.dish, dur, eatAnimation);
});

function eatAnimation(){
  sfxEat();
  custIcon.classList.add('happy');
  setTimeout(function(){ say('おいしい！ ' + state.recipe.price + 'えん どうぞ！'); }, 100);

  for (var i = 0; i < 6; i++){
    (function(k){ setTimeout(function(){ spawnHeartFX(); }, k*100); })(i);
  }

  setTimeout(function(){
    state.stars++;
    renderStars();
    Momo.sfx.star();
    changeSales(state.recipe.price);
  }, 500);

  setTimeout(function(){
    if (state.stars >= CLEAR_TARGET && state.stars % CLEAR_TARGET === 0){
      showClear();
    } else {
      newRound();
    }
  }, 2400);
}

/* =========================================================
   クリア → スタンプ
   ========================================================= */
function showClear(){
  state.phase = 'clearing';
  sfxClear();
  clearText.textContent = CLEAR_TARGET + '品 つくったよ！';
  clearOverlay.hidden = false;

  setTimeout(function(){
    clearOverlay.hidden = true;
    showStampBox();
  }, 1500);
}

function showStampBox(){
  state.boxOpened = false;

  var unowned = REST_STAMP_POOL.filter(function(s){ return state.myStamps.indexOf(s) === -1; });
  var pool = unowned.length > 0 ? unowned : REST_STAMP_POOL.slice();
  var chosen = pool[Math.floor(Math.random() * pool.length)];
  var color = HANKO_COLORS[Math.floor(Math.random() * HANKO_COLORS.length)];
  state.pendingStamp = { emoji: chosen, color: color };

  stampBoxBtn.classList.remove('opened', 'shaking');
  boxStamp.textContent = '';
  boxStamp.className = 'box-stamp';

  stampBoxScreen.hidden = false;
  Momo.duckBGM(true);
  setTimeout(function(){ Momo.speak('はこを タップして あけてね', 0.95); }, 500);
}

function openStampBox(){
  if (!state.pendingStamp || state.boxOpened) return;
  state.boxOpened = true;

  stampBoxBtn.classList.add('shaking');
  Momo.sfx.shake();

  setTimeout(function(){
    stampBoxBtn.classList.remove('shaking');
    boxStamp.textContent = state.pendingStamp.emoji;
    boxStamp.className = 'box-stamp hanko-' + state.pendingStamp.color;
    stampBoxBtn.classList.add('opened');
    Momo.sfx.reveal();

    /* ★ 共通モジュールで保存 */
    Momo.saveStamp(state.pendingStamp.emoji, 'restaurant', state.pendingStamp.color);
    state.myStamps.push(state.pendingStamp.emoji);
    Momo.updateBookBadge();

    setTimeout(function(){
      showPop('スタンプ ゲット！');
      Momo.speak('スタンプ ゲット', 0.95);
    }, 500);

    setTimeout(function(){
      stampBoxScreen.hidden = true;
      Momo.duckBGM(false);
      state.boxOpened = false;
      state.pendingStamp = null;
      state.stars = 0;
      renderStars();
      newRound();
    }, 2800);
  }, 600);
}

/* =========================================================
   イベント
   ========================================================= */
document.getElementById('homeBtn').addEventListener('click', function(){
  Momo.sfx.tap();
  Momo.cancelSpeech();
  Momo.stopBGM();
  Momo.notifyParent('goHome');
});

document.getElementById('bookBtn').addEventListener('click', function(){
  Momo.sfx.tap();
  Momo.cancelSpeech();
  Momo.stopBGM();
  Momo.notifyParent({ type: 'openBook', from: 'restaurant' });
});

orderTap.addEventListener('click', function(){
  if (state.recipe){
    var v = VOICE[state.customer] || {pitch:1.3, rate:1.0};
    Momo.speak(state.recipe.label + ' ちょうだい！', { voice: v });
  }
});
bubbleEl.addEventListener('click', function(e){
  e.stopPropagation();
  if (state.recipe){
    var v = VOICE[state.customer] || {pitch:1.3, rate:1.0};
    Momo.speak(state.recipe.label + ' ちょうだい！', { voice: v });
  }
});

stampBoxBtn.addEventListener('click', openStampBox);

document.addEventListener('visibilitychange', function(){
  if (document.hidden){
    Momo.stopBGM();
    Momo.cancelSpeech();
  } else {
    if (Momo.settings.soundOn) Momo.startBGM();
  }
});

/* =========================================================
   起動
   ========================================================= */
Momo.init();
Momo.updateBookBadge();

renderStars();
renderSales();
newRound();

})();
</script>
</body>
</html>
